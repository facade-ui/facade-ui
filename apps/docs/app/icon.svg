<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- The favicon form of the mark. A favicon inherits nothing and is drawn at
       16px, so the thin frame becomes a filled tile in the brand orange and the
       bars go to ink on top of it: no colour-scheme swap to get wrong, and the
       same icon on a light tab strip and a dark one. Everything sits on a
       3-unit grid, which is one pixel at 16px. -->
  <rect width="48" height="48" rx="9" fill="#f54900"/>
  <rect x="9" y="9" width="30" height="6" rx="2" fill="#0c0a09"/>
  <rect x="9" y="21" width="21" height="6" rx="2" fill="#0c0a09"/>
  <rect x="9" y="33" width="12" height="6" rx="2" fill="#0c0a09"/>
</svg>
