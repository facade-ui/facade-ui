packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security floors for transitive dev deps that pnpm won't lift on its own
# (vite is a vitest peer, undici comes in through jsdom). Drop once upstream
# ranges move past them.
overrides:
  vite: ^8.3.3
  undici: ^7.30.1
